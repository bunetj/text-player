<title>text player</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: #000;
    color: #e8edf2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Emoji', 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
}
.hub { text-align: center; }
h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 16px;
    font-family: 'Courier New', Courier, monospace;
    color: #6e6e6e;
    text-align: center;
    margin: 40px 0;
    text-indent: 16px;
}
h1:first-child { margin-top: 0; }
h1:last-child { margin-bottom: 0; }
.pad {
    display: BLOCK;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #c8d1da;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: 500;
    width: fit-content;
    margin: 12px auto;
}
.pad:hover { color: #e8edf2; }
.pad-emoji { font-size: 14px; line-height: 1; margin: 0 20px; }
</style>
<link rel="stylesheet" href="" />
</head>
<body>
<div class="hub twemoji">
<div id="hubUser" style="position:fixed;top:10px;left:12px;font-size:13px;color:#8e9aa5;font-family:inherit;">
  Name: <input id="hubName" type="text" value="Alex" style="background:transparent;border:none;border-bottom:1px solid #2a2a2a;color:#e8edf2;font:inherit;width:80px;outline:none;">
  Emoji: <input id="hubEmoji" type="text" value="\U0001F642" maxlength="4" style="background:transparent;border:none;border-bottom:1px solid #2a2a2a;color:#e8edf2;font:inherit;width:32px;text-align:center;outline:none;">
</div>
<script>
(function(){
  var n = document.getElementById('hubName');
  var e = document.getElementById('hubEmoji');
  function load(){
    fetch('/user', {cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(u){
      if (!u) return;
      if (typeof u.name === 'string') n.value = u.name;
      if (typeof u.emoji === 'string') e.value = u.emoji;
    }).catch(function(){});
  }
  function save(){
    fetch('/user', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name: n.value, emoji: e.value})
    }).catch(function(){});
  }
  n.addEventListener('input', save);
  e.addEventListener('input', save);
  load();
})();
</script>
