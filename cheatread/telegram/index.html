<script>
        // ============================================================
        // CHAT MFV - Working Version
        // ============================================================

        // STATE
        const state = {
            ownName: 'user',
            otherName: 'Alex',
            avatarEmoji: '👤',
            avatarColor: '#2b3b4a',
            ownColor: '#2b5278',
            lastLoadedScript: '',
            queue: [],
            finished: false,
            wpm: 200,
            fontSize: 14,
            currentIndex: 0,
            displayedCount: 0,
            userScrolledUp: false,
            isProgrammaticScroll: false,
        };

        // DOM REFS
        const input = document.getElementById('inputText');
        const msgs = document.getElementById('msgs');
        const ownInput = document.getElementById('ownInput');
        const chatName = document.getElementById('chatName');
        const modal = document.getElementById('modal');
        const modalOwn = document.getElementById('modalOwn');
        const modalOther = document.getElementById('modalOther');
        const modalCancel = document.getElementById('modalCancel');
        const modalSave = document.getElementById('modalSave');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalColor = document.getElementById('modalColor');
        const modalColorPreview = document.getElementById('modalColorPreview');
        const modalOwnColor = document.getElementById('modalOwnColor');
        const modalOwnPreview = document.getElementById('modalOwnPreview');
        const avatar = document.getElementById('avatar');

        // Detect manual scroll (ignore programmatic)
        msgs.addEventListener('scroll', function () {
            // Ignore programmatic scrolls
            if (state.isProgrammaticScroll) {
                state.isProgrammaticScroll = false;
                return;
            }
            var isAtBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 10;
            if (isAtBottom) {
                state.userScrolledUp = false;
            } else {
                state.userScrolledUp = true;
            }
        });

        // Double-click toggles the heart reaction on a message
        msgs.addEventListener('dblclick', function (e) {
            var msg = e.target.closest('.msg');
            if (!msg) return;
            msg.classList.toggle('reacted');
            saveState();
        });

        // FONT
        function applyFontSize() {
            if (msgs) msgs.style.setProperty('--messages-text-size', state.fontSize + 'px');
            var label = document.getElementById('sizeLabel');
            if (label) label.textContent = state.fontSize + 'px';
        }

        function fontIncrease() {
            state.fontSize = Math.min(state.fontSize + 2, 40);
            applyFontSize();
            saveState();
        }
        function fontDecrease() {
            state.fontSize = Math.max(state.fontSize - 2, 10);
            applyFontSize();
            saveState();
        }

        // CHAT FUNCTIONS
        function updateChatName() {
            chatName.textContent = state.otherName;
            if (avatar) {
                avatar.textContent = state.avatarEmoji || '👤';
                avatar.style.background = state.avatarColor || '#2b5278';
            }
            if (msgs) {
                msgs.style.setProperty('--own-color', state.ownColor);
                msgs.style.setProperty('--other-color', state.avatarColor);
                msgs.style.setProperty('--react-color', state.ownColor);
            }
        }

        var _msgApp = { state: state, msgs: msgs, applyFontSize: applyFontSize,
                        saveState: saveState, refreshBubbles: refreshBubbles,
                        autoPlay: null, _lastSendAt: 0 };
        function addMsg(text, type) {
            var _author = (type === 'own') ? 'own' : 'other';
            chatAddMsg(_msgApp, text, _author, { perspective: 'own', delay: 0 });
            state.displayedCount++;
        }

        // ---- bubble side tagging ----
        function refreshBubbles() {
            bubbleMarkSides(msgs, function (n) {
                return n.classList.contains('own') ? 'a' : 'b';
            });
        }


        function loadChat() {
            var raw = input.value;
            state.queue = splitBySeparator(raw, '\n---\n');
            state.finished = false;
            state.currentIndex = 0;
            state.displayedCount = 0;
            state.lastLoadedScript = raw;
            // NEVER clear messages - preserve chat history
        }

        function sendScenario() {
            if (state.finished || !state.queue.length) return;
            var next = state.queue.shift();
            // When a new message arrives from the queue, reset scroll state
            // so user sees the conversation continuing
            state.userScrolledUp = false;
            addMsg(next, 'recv');
            state.currentIndex = state.displayedCount;
            if (!state.queue.length) {
                state.finished = true;
                // NOTE: textarea is intentionally NOT cleared — keep the script
            }
        }

        function sendOwn() {
            var t = ownInput.value.trim();
            if (!t) return;
            // Reset scroll state - user is engaging, go to bottom
            state.userScrolledUp = false;
            addMsg(t, 'own');
            ownInput.value = '';
        }

        function handleSend() {
            // If the user wrote a new script since the last load, treat
            // it as fresh: reset finished/queue/state and reload.
            if (input.value !== state.lastLoadedScript) {
                state.finished = false;
                state.currentIndex = 0;
                state.queue = splitBySeparator(input.value, '\n---\n');
                state.lastLoadedScript = input.value;
            }

            var hasOwn = ownInput.value.trim() !== '';
            var hasQueue = state.queue.length > 0;
            var hasScript = input.value.trim() !== '';

            if (!hasOwn && !hasQueue && state.finished) {
                return;
            }

            // Sending your own message: never touch autoplay.
            if (hasOwn) {
                state.userScrolledUp = false;
                sendOwn();
                return;
            }

            // Empty own-input + autoplay running:
            // deliver ONE queued message, then stop autoplay ("manual mode").
            if (autoPlay && autoPlay.isPlaying()) {
                autoPlay.stopPlay();
                if (hasQueue) { sendScenario(); return; }
                return;
            }

            // No own message, autoplay not running: advance the queue manually.
            if (hasQueue) { sendScenario(); return; }
            if (hasScript) {
                state.finished = false;
                loadChat();
                if (state.queue.length) sendScenario();
                return;
            }
        }

                        function exportChat(opts) {
            var res = exportChatShared(msgs, opts, function (isOwn) {
                return isOwn ? state.ownName : state.otherName;
            });
            if (!res) { showClipToast('Nothing matched'); return; }
            writeClipboard(res.payload, function (status) {
                showClipToast(status === 'ok' ? ('Copied ' + res.count) : 'Copy blocked');
            });
        }


        // Enter sends, Shift+Enter newline
        ownInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        // mobile send button
        var __sendBtn = document.getElementById('sendBtn');
        if (__sendBtn) {
            __sendBtn.addEventListener('click', function (e) {
                e.preventDefault();
                handleSend();
                ownInput.focus();
            });
        }


        // AUTO-PLAY
        var autoPlay = {
            _playing: false,
            _timer: null,
            isPlaying: function () { return this._playing; },
            stopPlay: function () {
                this._playing = false;
                if (this._timer) { clearTimeout(this._timer); this._timer = null; }
                var btn = document.getElementById('playBtn');
                if (btn) btn.textContent = '▶';
                state.currentIndex = state.displayedCount;
                // keep currentIndex/displayedCount so Play resumes mid-script
                // (only reset if the textbox changed since playback started)
                if (state.queue.length === 0 && input.value.trim() !== '') {
                    state.finished = false;
                }
            },
            startPlay: function () {
                if (this._playing) return;
                // Always reload from textbox to get latest content
                var raw = input.value;
                state.queue = splitBySeparator(raw, '\n---\n');
                state.lastLoadedScript = raw;
                var items = state.queue;
                if (!items.length) {
                    return;
                }
                // Reset counters if starting fresh — but keep existing messages
                if (state.displayedCount >= items.length) {
                    state.displayedCount = 0;
                    state.currentIndex = 0;
                    state.userScrolledUp = false;
                }
                var startIdx = state.currentIndex;
                if (startIdx >= items.length) {
                    startIdx = 0;
                    state.currentIndex = 0;
                }
                if (state.displayedCount > 0 && state.displayedCount <= items.length) {
                    startIdx = state.displayedCount;
                }
                if (startIdx === 0 && msgs.children.length > 0) {
                    // Don't clear messages - preserve history
                    state.displayedCount = msgs.children.length;
                    state.userScrolledUp = false;
                }
                if (startIdx >= items.length) {
                    state.finished = true;
                    return;
                }
                var remaining = items.slice(startIdx);
                if (!remaining.length) return;
                this._playing = true;
                var btn = document.getElementById('playBtn');
                if (btn) btn.textContent = '⏹';
                var self = this;
                var idx = 0;
                var playNext = function () {
                    if (!self._playing) return;
                    if (idx < remaining.length) {
                        var item = remaining[idx];
                        addMsg(item, 'recv');
                        state.currentIndex = startIdx + idx + 1;
                        idx++;
                        if (idx < remaining.length) {
                            // Pre-bake delay before showing next message
                            var nextItem = remaining[idx];
                            self._timer = setTimeout(playNext, getDelay(nextItem));
                        } else {
                            state.finished = true;
                            self.stopPlay();
                        }
                    } else {
                        state.finished = true;
                        self.stopPlay();
                    }
                };
                // Start with a delay before first message (bake it first)
                var firstItem = remaining[0];
                this._timer = setTimeout(playNext, getDelay(firstItem));
                // Force scroll to bottom when starting
                state.userScrolledUp = false;
                state.isProgrammaticScroll = true;
                msgs.scrollTop = msgs.scrollHeight;
            }
        };

        // getDelay(item) — stub. Real formula TBD (see _buglist.md).
        // Rough: 60s / wpm * (chars/5). Flat fallback 800ms.
        function getDelay(item) {
            var wpm = state.wpm || 200;
            var s = (typeof item === 'string') ? item : (item && item.text) || '';
            var chars = s.length || 1;
            var ms = Math.round((60 / wpm) * (chars / 5) * 1000);
            if (!isFinite(ms) || ms < 100) ms = 800;
            return ms;
        }

        // splitPunct comes from text.js

// telegram: split on `---` only (no dashes, no blank lines)
function tgSplit(raw) {
    return raw.split(/\n\s*---\s*\n/)
              .map(function (s) { return s.trim(); })
              .filter(function (s) { return s; });
}

// punct-only splitter: splits on --- AND on dashes.
// Used ONLY by the punct button / punct bridge op.
function punctSplit(raw) {
    var blocks = raw.split(/\n\s*---\s*\n/).filter(function (s) { return s.trim(); });
    var out = [];
    for (var i = 0; i < blocks.length; i++) {
        var parts = splitOnDashes(blocks[i]);
        for (var j = 0; j < parts.length; j++) {
            if (parts[j]) out.push(parts[j]);
        }
    }
    return out;
}
function tgJoin(blocks) {
    return blocks.join('\n---\n');
}

// MENU EVENTS
function initMenu() {
    document.getElementById('fontSmall').onclick = fontDecrease;
    document.getElementById('fontBig').onclick = fontIncrease;
    document.getElementById('lowBtn').onclick = function () {
        var blocks = tgSplit(input.value);
        // open the shared popup on a temp textarea, then re-join with ---
        var tmp = document.createElement('textarea');
        tmp.value = blocks.join('\n\n');
        showLowPopup(tmp, '\n\n');
        // poll for close and copy back
        var poll = setInterval(function () {
            if (!document.getElementById('__lowPopup')) {
                clearInterval(poll);
                input.value = tgJoin(tgSplit(tmp.value));
                loadChat();
            }
        }, 50);
        if (state.queue) { state.queue = []; state.displayedCount = 0; state.currentIndex = 0; }
    };
    document.getElementById('punctBtn').onclick = function () {
        showPunctPopup(input, '\n---\n', punctSplit);
        var poll = setInterval(function () {
            if (!document.getElementById('__punctPopup')) {
                clearInterval(poll);
                input.value = tgJoin(tgSplit(input.value));
                loadChat();
            }
        }, 50);
        if (state.queue) { state.queue = []; state.displayedCount = 0; state.currentIndex = 0; }
    };
    document.getElementById('sentBtn').onclick = function () {
        var blocks = tgSplit(input.value);
        var out = [];
        for (var b = 0; b < blocks.length; b++) {
            var parts = splitSentences(blocks[b]);
            for (var i = 0; i < parts.length; i++) {
                var p = parts[i].trim();
                if (p) out.push(p);
            }
        }
        if (out.length) {
            input.value = tgJoin(out);
            loadChat();
        }
    };
    document.getElementById('applyBtn').onclick = function () {
        var n = parseInt(document.getElementById('wordCountInput').value) || 3;
        var blocks = tgSplit(input.value);
        var out = [];
        for (var b = 0; b < blocks.length; b++) {
            var words = blocks[b].split(/\s+/).filter(function (w) { return w; });
            for (var i = 0; i < words.length; i += n) {
                out.push(words.slice(i, i + n).join(' '));
            }
        }
        if (out.length) {
            input.value = tgJoin(out);
            loadChat();
        }
    };
    var speedSlider = document.getElementById('speedSlider');
    var speedValue = document.getElementById('speedValue');
    document.getElementById('slowerBtn').onclick = function () {
        state.wpm = Math.max(state.wpm - 25, 50);
        speedSlider.value = state.wpm;
        speedValue.textContent = state.wpm;
    };
    document.getElementById('fasterBtn').onclick = function () {
        state.wpm = Math.min(state.wpm + 25, 700);
        speedSlider.value = state.wpm;
        speedValue.textContent = state.wpm;
    };
    speedSlider.oninput = function (e) {
        state.wpm = parseInt(e.target.value);
        speedValue.textContent = state.wpm;
    };
    speedValue.textContent = state.wpm;
    document.getElementById('playBtn').onclick = function () {
        if (autoPlay.isPlaying()) autoPlay.stopPlay();
        else autoPlay.startPlay();
    };
    document.getElementById('namesBtn').onclick = function () {
        modalOwn.value = state.ownName;
        modalOther.value = state.otherName;
        // paint previews from real state (never hardcoded)
        if (modalColor) modalColor.value = state.avatarColor;
        if (modalColorPreview) modalColorPreview.style.background = state.avatarColor;
        if (modalOwnColor) modalOwnColor.value = state.ownColor;
        if (modalOwnPreview) modalOwnPreview.style.background = state.ownColor;
        if (modalEmoji) modalEmoji.value = state.avatarEmoji;
        openModal('modal');
        setTimeout(function () { modalOwn.focus(); }, 50);
    };
    document.getElementById('exportBtn').onclick = function () {
        openModal('clipModal');
    };
    document.getElementById('clearBtn').onclick = function () {
        if (!confirm('Clear chat?')) return;
        msgs.innerHTML = '';
        refreshBubbles();
        state.queue = [];
        state.displayedCount = 0;
        state.currentIndex = 0;
        state.finished = false;
        saveState();
    };
}

    // Reorganize menu - move prep/chunk to bottom
        

        // wire modal buttons
        if (modalColorPreview && modalColor) {
            modalColorPreview.onclick = function () { modalColor.click(); };
            modalColor.oninput = function () {
                modalColorPreview.style.background = modalColor.value;
            };
        }
        if (modalOwnPreview && modalOwnColor) {
            modalOwnPreview.onclick = function () { modalOwnColor.click(); };
            modalOwnColor.oninput = function () {
                modalOwnPreview.style.background = modalOwnColor.value;
            };
        }

        modalCancel.onclick = function () { closeModal('modal'); };
        modalSave.onclick = function () {
            state.ownName = modalOwn.value.trim() || 'user';
            state.otherName = modalOther.value.trim() || 'Alex';
            state.avatarEmoji = (modalEmoji && modalEmoji.value.trim()) || '👤';
            state.avatarColor = (modalColor && modalColor.value) || state.avatarColor;
            state.ownColor = (modalOwnColor && modalOwnColor.value) || state.ownColor;
            updateChatName();

        modal.onclick = function (e) {
            if (e.target === modal) closeModal('modal');
        };

        // Clipboard chooser modal wiring (shared)
        var clipModal = document.getElementById('clipModal');

// --- telegram-local low popup, styled to match the Names modal ---

        // ============================================================
        // PERSISTENCE (localStorage) — added by patcher
        // ============================================================
        var STORE_KEY = 'chat_mfv_v1';

        function saveState() {
            try {
                var msgsArr = [];
                var nodes = msgs.querySelectorAll('.msg');
                for (var i = 0; i < nodes.length; i++) {
                    var n = nodes[i];
                    msgsArr.push({
                        t: (n.dataset && n.dataset.raw != null) ? n.dataset.raw : n.textContent,
                        own: n.classList.contains('own'),
                        r: n.classList.contains('reacted')
                    });
                }
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    msgs: msgsArr,
                    script: input.value,
                    ownName: state.ownName,
                    otherName: state.otherName,
                    avatarEmoji: state.avatarEmoji,
                    avatarColor: state.avatarColor,
                    ownColor: state.ownColor,
                    lastLoadedScript: state.lastLoadedScript,
                    fontSize: state.fontSize,
                    wpm: state.wpm,
                    displayedCount: state.displayedCount,
                    currentIndex: state.currentIndex,
                    finished: state.finished
                }));
            } catch (e) {}
        }

        function loadState() {
            var raw;
            try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
            if (!raw) return false;
            var d;
            try { d = JSON.parse(raw); } catch (e) { return false; }
            if (!d) return false;

            if (d.ownName) state.ownName = d.ownName;
            if (d.otherName) state.otherName = d.otherName;
            if (d.avatarEmoji) state.avatarEmoji = d.avatarEmoji;
            if (d.avatarColor) state.avatarColor = d.avatarColor;
            if (d.ownColor) state.ownColor = d.ownColor;
            if (typeof d.lastLoadedScript === 'string') state.lastLoadedScript = d.lastLoadedScript;
            if (typeof d.fontSize === 'number') state.fontSize = d.fontSize;
            if (typeof d.wpm === 'number') state.wpm = d.wpm;
            if (typeof d.script === 'string') input.value = d.script;

            if (d.msgs && d.msgs.length) {
                for (var i = 0; i < d.msgs.length; i++) {
                    var m = d.msgs[i];
                    var _p = m.own ? 'own' : 'other';
                    var el = createMsgNode(m.t, _p, 0, !!m.r, 'own');
                    msgs.appendChild(el);
                }
                state.displayedCount = d.msgs.length;
            }

            if (typeof d.currentIndex === 'number') state.currentIndex = d.currentIndex;
            if (typeof d.finished === 'boolean') state.finished = d.finished;
            refreshBubbles();
            return true;
        }

        // ---- persist script as the user types ----
        input.addEventListener('input', saveState);

        // ---- settings modal wiring ----
        var settingsModal = document.getElementById('settingsModal');
        document.getElementById('dotsBtn').onclick = function () {
            openModal('settingsModal');
        };
        document.getElementById('settingsClose').onclick = function () {
            closeModal('settingsModal');
        };
        settingsModal.onclick = function (e) {
            if (e.target === settingsModal) closeModal('settingsModal');
        };

    buildMenu();
            initMenu();
        var __restored = loadState();
        applyFontSize();
        updateChatName();
        // sync modal picker defaults to the persisted colors
        if (modalColor) modalColor.value = state.avatarColor;
        if (modalColorPreview) modalColorPreview.style.background = state.avatarColor;
        if (modalOwnColor) modalOwnColor.value = state.ownColor;
        if (modalOwnPreview) modalOwnPreview.style.background = state.ownColor;
        if (!__restored) {
            loadChat();
        } else {
            state.queue = splitBySeparator(input.value, '\n---\n');
        }
        // Initial scroll to bottom if messages exist
        setTimeout(function () {
            state.isProgrammaticScroll = true;
            msgs.scrollTop = msgs.scrollHeight;
        }, 100);

                    

        // modals: shared stack (see shared/modal.js)
        modalInitStack(['settingsModal', 'clipModal', 'modal']);

</script>

        <script src="../../shared/bridge.js"></script>
</body>
