<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>formatter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #141414;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e8edf2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 640px;
            height: 100vh;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #262626;
            border-radius: 12px;
            padding: 6px 10px;
            border: 1px solid #333333;
            align-items: center;
        }

        .menu-section {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 4px;
            border-right: 1px solid #333333;
        }
        .menu-section:last-child { border-right: none; }

        .menu-label {
            font-size: 10px;
            color: #5e6f7e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
            font-weight: 600;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #8e9aa5;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .menu-btn:hover { background: #333333; color: #e8edf2; }

        .menu-label-display {
            font-size: 11px;
            color: #8e9aa5;
            min-width: 28px;
            text-align: center;
        }

        .textbox-area {
            flex-shrink: 0;
        }

        .textbox-area textarea {
            width: 100%;
            height: 70px;
            padding: 10px 14px;
            background: #262626;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #e8edf2;
            font-size: 13px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            line-height: 1.5;
        }
        .textbox-area textarea:focus { outline: none; border-color: #4a4a4a; }
        .textbox-area textarea::placeholder { color: #5e6f7e; }

        .footer {
            padding: 4px 4px 0 4px;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .footer-info {
            color: #5e6f7e;
            font-size: 12px;
            cursor: help;
        }

        @media (max-width: 440px) {
            .app { padding: 4px; max-height: 100vh; height: 100vh; }
            .toolbar { padding: 4px 6px; gap: 2px; }
            .menu-section { padding: 0 2px; }
            .menu-label { font-size: 9px; display: none; }
            .menu-btn { font-size: 12px; padding: 2px 6px; }
        }
    </style>
    <link rel="stylesheet" href="../shared/modal.css">
</head>

<body>

    <div class="app">
        <div class="toolbar" id="toolbar"></div>

        <div class="textbox-area">
            <textarea id="inputText" placeholder=""></textarea>
        </div>

        <div class="footer">
            <span class="footer-info" title="open in a text editor, choose a font, zoom in">ℹ️</span>
        </div>
    </div>

    <script src="../shared/ui.js"></script>
    <script src="../shared/text.js"></script>
    <script src="../shared/prep.js"></script>
    <script>
        // ============================================================
        // FORMATTER — text transformation only, no chat / no preview.
        // ============================================================

        var state = {
            separator: 'none',      // 'none' | 'newline' | 'blank'
        };

        var input = document.getElementById('inputText');

        var STORE_KEY = 'formatter_v1';

        function saveState() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    script: input.value,
                    separator: state.separator,
                }));
            } catch (e) {}
        }

        function loadState() {
            var raw;
            try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
            if (!raw) return false;
            var d;
            try { d = JSON.parse(raw); } catch (e) { return false; }
            if (!d) return false;
            if (typeof d.script === 'string') input.value = d.script;
            if (typeof d.separator === 'string') state.separator = d.separator;
            return true;
        }

        // ---------- separator logic ----------
        // The app NEVER auto-inserts message separators. Only the
        // "separator" modal joins blocks, and only when the user picks one.

        function joinWith() {
            if (state.separator === 'newline') return '\n';
            if (state.separator === 'blank')   return '\n\n';
            return ''; // 'none' — caller decides what to do
        }

        // ---------- separator modal ----------
        function showSeparatorPopup() {
            var existing = document.getElementById('__sepPopup');
            if (existing) existing.remove();

            var overlay = document.createElement('div');
            overlay.id = '__sepPopup';
            overlay.className = 'modal active';

            var box = document.createElement('div');
            box.className = 'modal-box';

            function radio(id, val, label, checked) {
                return '<label><input type="radio" name="sep" id="' + id + '" value="' + val + '"' +
                       (checked ? ' checked' : '') + '> ' + label + '</label>';
            }

            box.innerHTML =
                '<h3>Separator</h3>' +
                '<div class="sub">How blocks are joined after formatting</div>' +
                radio('sepNone', 'none',    'No changes', state.separator === 'none') +
                radio('sepNewline', 'newline', 'New line', state.separator === 'newline') +
                radio('sepBlank', 'blank',   'Empty line', state.separator === 'blank') +
                '<div class="btn-row">' +
                '   <button class="btn-cancel" id="sepCancel">Cancel</button>' +
                '   <button class="btn-save" id="sepApply">Apply</button>' +
                '</div>';
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            function close() { if (overlay.parentNode) overlay.remove(); }

            function apply() {
                var r = box.querySelector('input[name="sep"]:checked');
                state.separator = r ? r.value : 'none';
                saveState();
                close();
            }

            box.querySelector('#sepCancel').onclick = close;
            box.querySelector('#sepApply').onclick = apply;
            overlay.onclick = function (e) { if (e.target === overlay) close(); };

            document.addEventListener('keydown', function onKey(e) {
                if (!document.getElementById('__sepPopup')) {
                    document.removeEventListener('keydown', onKey);
                    return;
                }
                if (e.key === 'Escape') {
                    e.preventDefault(); close();
                    document.removeEventListener('keydown', onKey);
                } else if (e.key === 'Enter') {
                    if (e.target && e.target.tagName === 'TEXTAREA') return;
                    e.preventDefault(); apply();
                    document.removeEventListener('keydown', onKey);
                }
            });
        }

        // ---------- menu ----------
        function buildMenu() {
            var toolbar = document.getElementById('toolbar');
            toolbar.innerHTML =
                '<div class="menu-section">' +
                '   <span class="menu-label">PREP</span>' +
                '   <button class="menu-btn" id="lowBtn">low</button>' +
                '   <button class="menu-btn" id="punctBtn">punct</button>' +
                '   <button class="menu-btn" id="sentBtn">sentences</button>' +
                '</div>' +
                '<div class="menu-section">' +
                '   <span class="menu-label">CHUNK words:</span>' +
                '   <input type="number" id="wordCountInput" value="3" min="1" style="width:48px;padding:2px 12px 2px 8px;background:#333333;border:none;border-radius:4px;color:#e8edf2;font-size:12px;text-align:center;">' +
                '   <button class="menu-btn" id="applyBtn">apply</button>' +
                '</div>' +
                '<div class="menu-section">' +
                '   <span class="menu-label">SEPARATOR</span>' +
                '   <button class="menu-btn" id="sepBtn">¶</button>' +
                '</div>';
        }

        // ---------- formatter actions ----------
        // Blocks for prep operations always come from blank-line split —
        // this app does NOT auto-split on dashes.

        function blocks() {
            return splitByBlankLines(input.value);
        }

        function rejoin(blocksArr) {
            if (state.separator === 'none') {
                // keep original spacing — we can't recover it, so use \n\n
                // as the least-surprising default in 'none' mode too.
                return blocksArr.join('\n\n');
            }
            return blocksArr.join(joinWith());
        }

        // ---------- events ----------
        function initMenu() {
            document.getElementById('lowBtn').onclick = function () {
                showLowPopup(input, joinWith() || '\n\n');
                var poll = setInterval(function () {
                    if (!document.getElementById('__lowPopup')) {
                        clearInterval(poll);
                        saveState();
                    }
                }, 50);
            };

            document.getElementById('punctBtn').onclick = function () {
                showPunctPopup(input, joinWith() || '\n\n', splitByBlankLines);
                var poll = setInterval(function () {
                    if (!document.getElementById('__punctPopup')) {
                        clearInterval(poll);
                        saveState();
                    }
                }, 50);
            };

            document.getElementById('sentBtn').onclick = function () {
                var base = blocks();
                var out = [];
                for (var b = 0; b < base.length; b++) {
                    var parts = splitSentences(base[b]);
                    for (var i = 0; i < parts.length; i++) {
                        if (parts[i].trim()) out.push(parts[i].trim());
                    }
                }
                if (out.length) input.value = rejoin(out);
                saveState();
            };

            document.getElementById('applyBtn').onclick = function () {
                var n = parseInt(document.getElementById('wordCountInput').value) || 3;
                var base = blocks();
                var out = [];
                for (var b = 0; b < base.length; b++) {
                    var chunks = splitWords(base[b], n);
                    for (var i = 0; i < chunks.length; i++) {
                        if (chunks[i].trim()) out.push(chunks[i]);
                    }
                }
                if (out.length) input.value = rejoin(out);
                saveState();
            };

            document.getElementById('sepBtn').onclick = showSeparatorPopup;
        }

        // ---------- init ----------
        buildMenu();
        initMenu();
        loadState();

        input.addEventListener('input', saveState);

        // keyboard shortcuts
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                input.focus();
                input.select();
            }
        });
    </script>

    <script src="../shared/bridge.js"></script>
</body>

</html>
