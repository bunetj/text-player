<head>
    <meta charset="UTF-8">

    <title>subtitles simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #141414;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html, body { height: 100%; }
        .app {
            width: 100%;
            max-width: 640px;
            height: 100vh;
            max-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px;
            gap: 8px;
        }

        .textbox-area { flex-shrink: 0; }
        .textbox-area textarea {
            width: 100%;
            height: 70px;
            padding: 10px 14px;
            background: #262626;
            border: 1px solid #333333;
            border-radius: 12px;
            color: #e8edf2;
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
        }
        .textbox-area textarea:focus { outline: none; }
        .textbox-area textarea::placeholder { color: #5e6f7e; }

        .toolbar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #262626;
            border-radius: 12px;
            padding: 6px 10px;
            border: 1px solid #333333;
            align-items: center;
        }
        .menu-section {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 4px;
            border-right: 1px solid #333333;
        }
        .menu-section:last-child { border-right: none; }
        .menu-label {
            font-size: 10px;
            color: #5e6f7e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
            font-weight: 600;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #8e9aa5;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .menu-label-display {
            font-size: 11px;
            color: #8e9aa5;
            min-width: 28px;
            text-align: center;
        }
        .menu-range {
            width: 60px;
            accent-color: #7a7a7a;
            background: #333333;
            height: 4px;
            border-radius: 2px;
        }
        .menu-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #7a7a7a;
            cursor: pointer;
        }
        .menu-range::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #7a7a7a;
            border: none;
            cursor: pointer;
        }
        .menu-input-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 400;
            color: #8e9aa5;
        }
        .menu-input-label input {
            width: 48px;
            padding: 2px 12px 2px 8px;
            background: #333333;
            border: none;
            border-radius: 4px;
            color: #e8edf2;
            font-size: 12px;
            text-align: center;
        }
        .menu-input-label input:focus { outline: 1px solid #7a7a7a; }

        .sub-wrap {
            height: 100%;
            background: #1c1c1c;
            border-radius: 16px;
            border: 1px solid #333333;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding: 20px 20px 32px;
        }
        .sub-text {
            background: #000;
            color: #fff;
            font-size: 28px;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            text-align: center;
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 90%;
            display: inline-block;
        }

        .footer {
            padding: 4px 4px 0 4px;
            display: flex;
            justify-content: flex-end;
            flex-shrink: 0;
        }
        .footer-info { color: #5e6f7e; font-size: 12px; cursor: default; }

        .bottom-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 4px 8px;
            height: 44px;
        }
        .bottom-bar .bar-play {
            font-size: 22px;
            color: #e8edf2;
            background: #262626;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .bottom-bar .bar-play:hover { background: #333; }
        .bottom-bar .bar-gear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #8e9aa5;
            background: transparent;
            padding: 6px 10px;
        }
        .bottom-bar .bar-gear:hover { color: #e8edf2; }

        @media (max-width: 440px) {
            .app { padding: 4px; max-height: 100vh; height: 100vh; }
            .toolbar { padding: 4px 6px; gap: 2px; }
            .menu-section { padding: 0 2px; }
            .menu-label { font-size: 9px; display: none; }
            .menu-btn { font-size: 12px; padding: 2px 6px; }
            .menu-range { width: 40px; }
            .sub-text { font-size: 20px; padding: 8px 16px; }
        }

<script src="../shared/modal.js"></script>

    <script>
        // ============================================================
        // SUBTITLE MFV - Minimal Functional Version
        // ============================================================

        // STATE
        const state = {
            blocks: [],
            idx: 0,
            hasContent: false,
            wpm: 250,
            fontSize: 20,
        };

        // DOM REFS
        const input = document.getElementById('inputText');
        const display = document.getElementById('display');

        // ============================================================
        // PERSISTENCE (localStorage)
        // ============================================================
        var STORE_KEY = 'subtitles_mfv_v1';

        function saveState() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                    script: input.value,
                    idx: state.idx,
                    wpm: state.wpm,
                    fontSize: state.fontSize
                }));
            } catch (e) {}
        }

        function loadState() {
            var raw;
            try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
            if (!raw) return false;
            var d;
            try { d = JSON.parse(raw); } catch (e) { return false; }
            if (!d) return false;

            if (typeof d.script === 'string') input.value = d.script;
            if (typeof d.wpm === 'number') state.wpm = d.wpm;
            if (typeof d.fontSize === 'number') state.fontSize = d.fontSize;
            if (typeof d.idx === 'number') state.idx = d.idx;
            return true;
        }

        // HELPERS
                var WRAP_WIDTH = 40;

        // Split raw text into message blocks: blank lines first, then any
        // dash-separator inside each block. Dash removed.
        function splitBlocks(raw) {
            var base = splitByBlankLines(raw);
            var out = [];
            for (var i = 0; i < base.length; i++) {
                var parts = splitOnDashes(base[i]);
                for (var j = 0; j < parts.length; j++) {
                    if (parts[j]) out.push(parts[j]);
                }
            }
            return out;
        }

        // ============================================================
        // WAKE LOCK  (keep screen awake during playback)
        // Tier 1: Screen Wake Lock API (Chromium/Safari)
        // Tier 2: invisible looping muted video (Firefox fallback)
        // ============================================================
        var _wakeLock = null;
        var _keepAliveVideo = null;

        function _makeKeepAliveVideo() {
            if (_keepAliveVideo) return _keepAliveVideo;
            // 1x1 black webm, looping, muted. Embedded so no extra file.
            // (tiny base64 webm; silent, <1KB)
            var v = document.createElement('video');
            v.setAttribute('playsinline', '');
            v.muted = true;
            v.loop = true;
            v.style.position = 'fixed';
            v.style.width = '1px';
            v.style.height = '1px';
            v.style.opacity = '0';
            v.style.pointerEvents = 'none';
            v.style.left = '-9999px';
            v.src = 'data:video/webm;base64,GkXfo0AgQoaBAUL6mQEEQICAgIAAAABDhpB0AAAB9OHhAAAB4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg';
            document.body.appendChild(v);
            _keepAliveVideo = v;
            return v;
        }

        function startWakeLock() {
            // Tier 1
            if (navigator.wakeLock && navigator.wakeLock.request) {
                navigator.wakeLock.request('screen').then(function (wl) {
                    _wakeLock = wl;
                    wl.addEventListener('release', function () { _wakeLock = null; });
                }).catch(function () {
                    // fall through to tier 2
                    _startKeepAliveVideo();
                });
                return;
            }
            // Tier 2
            _startKeepAliveVideo();
        }

        function _startKeepAliveVideo() {
            var v = _makeKeepAliveVideo();
            var p = v.play();
            if (p && p.catch) p.catch(function () { /* autoplay blocked; nothing else we can do */ });
        }

        function stopWakeLock() {
            if (_wakeLock) {
                try { _wakeLock.release(); } catch (e) {}
                _wakeLock = null;
            }
            if (_keepAliveVideo) {
                try { _keepAliveVideo.pause(); } catch (e) {}
            }
        }

        function wrapText(t) {
            return t.split('\n').map(function (line) {
                var words = line.split(/\s+/).filter(Boolean);
                var out = [], cur = '';
                for (var i = 0; i < words.length; i++) {
                    var w = words[i];
                    if (cur && (cur + ' ' + w).length > WRAP_WIDTH) { out.push(cur); cur = w; }
                    else { cur = cur ? cur + ' ' + w : w; }
                }
                if (cur) out.push(cur);
                return out.join('\n');
            }).join('\n');
        }

        function getDelay(item) {
            var chars = item ? item.length : 0;
            var words = Math.max(chars / 5, 1);
            var msPerWord = 60000 / state.wpm;

            // Reading time based on word count
            var readingTime = words * msPerWord;

            // Base pause: longer messages get slightly longer pause
            // Minimum 300ms, scales with message length, capped at 1200ms
            var basePause = 300 + (words * 10);
            basePause = Math.min(basePause, 1200);

            // Punctuation adds extra pause
            var punctPause = 0;
            if (item && /[.!?]$/.test(item)) {
                punctPause = 200 + Math.random() * 200;
            } else if (item && /[,;:]$/.test(item)) {
                punctPause = 100 + Math.random() * 100;
            }

            var delay = readingTime + basePause + punctPause;

            // Natural variation
            delay *= (0.85 + Math.random() * 0.3);

            // Clamp
            delay = Math.max(delay, 800);
            delay = Math.min(delay, 15000);
            return delay;
        }

        // FONT
        function __applyFontSizeLocal() {
    applyFontSize(display, state.fontSize);
}

        function fontIncrease() {
            state.fontSize = Math.min(state.fontSize + 2, 60);
            __applyFontSizeLocal();
            __syncSizeLabel();
            saveState();
        }
        function fontDecrease() {
            state.fontSize = Math.max(state.fontSize - 2, 10);
            __applyFontSizeLocal();
            __syncSizeLabel();
            saveState();
        }
        function __syncSizeLabel() {
            var el = document.getElementById('sizeLabel');
            if (el) el.textContent = state.fontSize + 'px';
        }

        // SUBTITLE FUNCTIONS
        function render() {
            if (!state.blocks.length || !state.hasContent) {
                display.textContent = '';
                return;
            }
            if (state.idx >= state.blocks.length) state.idx = state.blocks.length - 1;
            if (state.idx < 0) state.idx = 0;
            display.textContent = wrapText(state.blocks[state.idx]);
            __applyFontSizeLocal();
            saveState();
        }

        function loadFromTextbox() {
            if (autoPlay && autoPlay.isPlaying()) {
                autoPlay.stopPlay();
            }
            var raw = input.value;
            state.blocks = splitBlocks(raw);
            state.hasContent = state.blocks.length > 0;
            state.idx = 0;
            render();
        }

        function triggerLoad() {
            if (!state.hasContent || state.blocks.length === 0) loadFromTextbox();
            render();
        }

        // AUTO-PLAY
        var autoPlay = {
            _playing: false,
            _timer: null,
            _queue: [],
            _currentIdx: 0,

            isPlaying: function () { return this._playing; },

            stopPlay: function () {
                this._playing = false;
                if (this._timer) { clearTimeout(this._timer); this._timer = null; }
                stopWakeLock();
                var btn = document.getElementById('playBtn');
                if (btn) btn.textContent = '▶';
                state.idx = this._currentIdx;
            },

            startPlay: function () {
                if (this._playing) return;
                var items = state.blocks;
                if (!items.length) {
                    loadFromTextbox();
                    items = state.blocks;
                    if (!items.length) return;
                }

                this._playing = true;
                startWakeLock();
                var btn = document.getElementById('playBtn');
                if (btn) btn.textContent = '⏹';

                var startIdx = state.idx;
                if (startIdx >= items.length) {
                    startIdx = 0;
                    state.idx = 0;
                }

                this._currentIdx = startIdx;
                var remaining = items.slice(startIdx);
                if (!remaining.length) {
                    this.stopPlay();
                    return;
                }

                var self = this;
                var idx = 0;

                var playNext = function () {
                    if (!self._playing) return;
                    if (idx < remaining.length) {
                        var item = remaining[idx];
                        display.textContent = wrapText(item);
                        __applyFontSizeLocal();
                        self._currentIdx = startIdx + idx;
                        state.idx = self._currentIdx;
                        idx++;
                        // Delay is for the CURRENT message (time to read it)
                        // If there are more messages, schedule next after this delay
                        if (idx < remaining.length) {
                            self._timer = setTimeout(playNext, getDelay(item));
                        } else {
                            // Last message - show it and stop after its delay
                            self._timer = setTimeout(function () {
                                self.stopPlay();
                            }, getDelay(item));
                        }
                    } else {
                        self.stopPlay();
                    }
                };

                // Start with first message immediately, delay comes from playNext
                var firstItem = remaining[0];
                display.textContent = wrapText(firstItem);
                __applyFontSizeLocal();
                self._currentIdx = startIdx;
                state.idx = startIdx;
                idx = 1;
                // Schedule next message after current message's delay
                if (remaining.length > 1) {
                    this._timer = setTimeout(playNext, getDelay(firstItem));
                } else {
                    // Only one message - show it and stop after delay
                    this._timer = setTimeout(function () {
                        self.stopPlay();
                    }, getDelay(firstItem));
                }
            }
        };

        // FORMATTERS
                                // LOW POPUP
        var lowPopupInstance = null;

                // CHUNKING
                // BUILD MENU
        function buildMenu() {
            var top = document.getElementById('toolbar-top');
            var bottom = document.getElementById('toolbar-bottom');

            // top toolbar: empty (font/speed moved to settings panel)
            if (top) top.innerHTML = '';

            // bottom toolbar: PREP + CHUNK only
            if (bottom) bottom.innerHTML =
                '<div class="menu-section">' +
                '   <span class="menu-label">PREP</span>' +
                '   <button class="menu-btn" id="lowBtn">low</button>' +
                '   <button class="menu-btn" id="punctBtn">punct</button>' +
                '   <button class="menu-btn" id="sentBtn">sentences</button>' +
                '   <button class="menu-btn" id="pdfBtn">pdf</button>' +
                '</div>' +
                '<div class="menu-section">' +
                '   <span class="menu-label">CHUNK words:</span>' +
                '   <input type="number" id="wordCountInput" value="3" min="1" style="width:48px;padding:2px 12px 2px 8px;background:#333333;border:none;border-radius:4px;color:#e8edf2;font-size:12px;text-align:center;">' +
                '   <button class="menu-btn" id="applyBtn">apply</button>' +
                '</div>';
        }

        // MENU EVENTS
        function initMenu() {
            // Helper to stop autoplay on any control click
            function stopPlayOnControl() {
                if (autoPlay && autoPlay.isPlaying()) {
                    autoPlay.stopPlay();
                }
            }

            document.getElementById('fontSmall').onclick = function () {
                // Font change does NOT stop autoplay
                fontDecrease();
            };
            document.getElementById('fontBig').onclick = function () {
                // Font change does NOT stop autoplay
                fontIncrease();
            };
            document.getElementById('lowBtn').onclick = function () {
                stopPlayOnControl();
                showLowPopup(input, '\n\n');
                // after apply, refresh blocks and display
                var poll = setInterval(function () {
                    if (!document.getElementById('__lowPopup')) {
                        clearInterval(poll);
                        state.blocks = splitBlocks(input.value);
                        state.hasContent = state.blocks.length > 0;
                        state.idx = 0;
                        render();
                    }
                }, 50);
            };
            document.getElementById('punctBtn').onclick = function () {
                stopPlayOnControl();
                showPunctPopup(input, '\n\n', splitBlocks);
                var poll = setInterval(function () {
                    if (!document.getElementById('__punctPopup')) {
                        clearInterval(poll);
                        state.blocks = splitBlocks(input.value);
                        state.hasContent = state.blocks.length > 0;
                        state.idx = 0;
                        render();
                    }
                }, 50);
            };
            document.getElementById('sentBtn').onclick = function () {
                stopPlayOnControl();
                var raw = input.value;
                var blocks = [];
                var baseBlocks = splitBlocks(raw);
                for (var b = 0; b < baseBlocks.length; b++) {
                    var parts = splitSentences(baseBlocks[b]);
                    for (var i = 0; i < parts.length; i++) { blocks.push(parts[i]); }
                }
                if (blocks.length) {
                    var mapped = [];
                    for (var i = 0; i < blocks.length; i++) {
                        mapped.push(blocks[i].trim());
                    }
                    input.value = mapped.join('\n\n');
                    state.blocks = mapped;
                    state.hasContent = true;
                    state.idx = 0;
                    render();
                }
            };
            document.getElementById('pdfBtn').onclick = function () {
                stopPlayOnControl();
                if (typeof formatAsPdf !== 'function') return;
                input.value = formatAsPdf(input.value);
                state.blocks = splitBlocks(input.value);
                state.hasContent = state.blocks.length > 0;
                state.idx = 0;
                render();
                saveState();
            };
            document.getElementById('applyBtn').onclick = function () {
                stopPlayOnControl();
                // chunk each block from splitBlocks, join with \n\n
                var n = parseInt(document.getElementById('wordCountInput').value) || 3;
                var base = splitBlocks(input.value);
                var out = [];
                for (var b = 0; b < base.length; b++) {
                    var chunks = splitWords(base[b], n);
                    for (var i = 0; i < chunks.length; i++) {
                        if (chunks[i].trim()) out.push(chunks[i]);
                    }
                }
                if (out.length) input.value = out.join('\n\n');
                state.blocks = splitBlocks(input.value);
                state.hasContent = state.blocks.length > 0;
                state.idx = 0;
                render();
            };

            var speedValue = document.getElementById('speedValue');
            var speedWidget = makeSpeedInput({
                input: speedValue,
                min: 50, max: 700, step: 25,
                get: function () { return state.wpm; },
                set: function (n) { state.wpm = n; saveState(); }
            });
            window.__speedWidget = speedWidget;

            document.getElementById('playBtn').onclick = function () {
                if (autoPlay.isPlaying()) autoPlay.stopPlay();
                else autoPlay.startPlay();
            };

            // ⚙ toggles the floating settings panel (font + speed).
            var panel = document.getElementById('settingsPanel');
            var gear = document.getElementById('gearBtn');
            if (gear && panel) {
                gear.onclick = function (e) {
                    e.stopPropagation();
                    panel.classList.toggle('open');
                };
                // click anywhere outside the panel closes it
                document.addEventListener('click', function (e) {
                    if (!panel.classList.contains('open')) return;
                    if (panel.contains(e.target)) return;
                    if (e.target === gear) return;
                    panel.classList.remove('open');
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') panel.classList.remove('open');
                });
            }

            // 📄 opens the text modal (textarea + prep toolbar only).
            var textBtn = document.getElementById('textBtn');
            var settingsModal = document.getElementById('settingsModal');
            if (textBtn && settingsModal) {
                textBtn.onclick = function () {
                    if (typeof openModal === 'function') openModal('settingsModal');
                    else settingsModal.classList.add('active');
                };
                settingsModal.onclick = function (e) {
                    if (e.target === settingsModal) {
                        if (typeof closeModal === 'function') closeModal('settingsModal');
                        else settingsModal.classList.remove('active');
                    }
                };
            }
        }

        // KEYBOARD SHORTCUTS
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === ' ' || e.key === 'Space' || e.code === 'Space') {
                e.preventDefault();
                var btn = document.getElementById('playBtn');
                if (btn) btn.click();
            }
            if (e.key === 'r' || e.key === 'R') {
                // let Ctrl+R / Cmd+R fall through to the browser (reload)
                if (e.ctrlKey || e.metaKey) return;
                e.preventDefault();
                state.idx = 0;
                loadFromTextbox();
            }
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                input.focus();
                input.select();
            }
        });

        // NAVIGATION - Arrow keys (STOP autoplay)
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            var items = state.blocks;
            if (!items.length) return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                // let Alt+Arrow fall through to the browser (back/forward)
                if (e.altKey) return;
                e.preventDefault();
                // Stop autoplay when user navigates manually
                if (autoPlay && autoPlay.isPlaying()) {
                    autoPlay.stopPlay();
                }
                if (e.key === 'ArrowLeft') {
                    state.idx = Math.max(0, state.idx - 1);
                } else {
                    state.idx = Math.min(items.length - 1, state.idx + 1);
                }
                render();
            }
        });

        // TEXTBOX AUTO-UPDATE
        input.oninput = function () {
            var raw = this.value;
            state.blocks = splitBlocks(raw);
            state.hasContent = state.blocks.length > 0;
            state.idx = 0;
            // DON'T render automatically - wait for control click
            // Display stays showing current subtitle until user acts
            saveState();
        };

        
    buildMenu();
        initMenu();
        var __restored = loadState();
        if (__restored) {
            // rebuild blocks from restored script
            state.blocks = splitBlocks(input.value);
            state.hasContent = state.blocks.length > 0;
            if (state.idx >= state.blocks.length) state.idx = Math.max(0, state.blocks.length - 1);
            if (window.__speedWidget) window.__speedWidget.refresh();
        } else {
            loadFromTextbox();
        }
        __applyFontSizeLocal();
        render();
        __syncSizeLabel();
        if (window.__speedWidget) window.__speedWidget.refresh();

        // ============================================================
        // MOBILE: tap left/right half of the display acts as ← / →
        // Desktop mouse clicks are ignored.
        // ============================================================
        (function () {
            var wrap = document.querySelector('.sub-wrap');
            if (!wrap) return;

            wrap.style.touchAction = 'manipulation';
            wrap.style.webkitTapHighlightColor = 'transparent';

            function step(dir) {
                var items = state.blocks;
                if (!items.length) return;
                if (autoPlay && autoPlay.isPlaying()) autoPlay.stopPlay();
                if (dir < 0) state.idx = Math.max(0, state.idx - 1);
                else         state.idx = Math.min(items.length - 1, state.idx + 1);
                render();
            }

            // Real touch taps only. touchend covers iOS/Android;
            // pointerup with pointerType==='touch' covers modern Chromium.
            // We do NOT listen to 'click' at all, so desktop mouse is a no-op.
            function handleTouchPoint(clientX) {
                var rect = wrap.getBoundingClientRect();
                step((clientX - rect.left) < rect.width / 2 ? -1 : 1);
            }

            wrap.addEventListener('touchend', function (e) {
                var t = e.changedTouches && e.changedTouches[0];
                if (!t) return;
                handleTouchPoint(t.clientX);
            }, { passive: true });

            wrap.addEventListener('pointerup', function (e) {
                if (e.pointerType !== 'touch') return;
                handleTouchPoint(e.clientX);
            }, { passive: true });
        })();

</script>
        <script src="../shared/bridge.js"></script>
